[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-job-queue"
version = "0.1.0"
description = "A distributed job processing platform"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "minio>=7.2,<8.0",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "redis>=5.0,<6.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
outbox-publisher = "distributed_job_queue.publisher.runner:main"
job-api = "distributed_job_queue.api.runner:main"
job-worker = "distributed_job_queue.workers.runner:main"
job-scheduler = "distributed_job_queue.scheduler.runner:main"
worker-monitor = "distributed_job_queue.recovery.runner:main"
recovery-monitor = "distributed_job_queue.recovery.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
