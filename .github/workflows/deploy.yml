name: Deploy production

on:
  workflow_run:
    workflows: [Verify local release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    steps:
      - name: Configure verified SSH access
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/relay-ssh"
          printf '%s\n' "$PROD_SSH_KEY" > "$RUNNER_TEMP/relay-ssh/key"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$RUNNER_TEMP/relay-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/relay-ssh/key" "$RUNNER_TEMP/relay-ssh/known_hosts"

      - name: Deploy verified revision
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_USER: ${{ vars.PROD_USER }}
        run: |
          ssh -i "$RUNNER_TEMP/relay-ssh/key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/relay-ssh/known_hosts" \
            "$PROD_USER@$PROD_HOST" bash -s -- "$DEPLOY_SHA" <<'REMOTE'
          set -eu
          deploy_sha="$1"
          cd /opt/relay
          git fetch --prune origin main
          git merge --ff-only "$deploy_sha"
          test "$(git rev-parse HEAD)" = "$deploy_sha"
          docker compose --env-file deploy/.env.production \
            -f compose.yaml -f compose.production.yaml config --quiet
          docker compose --env-file deploy/.env.production \
            -f compose.yaml -f compose.production.yaml pull \
            postgres redis minio minio-init prometheus caddy
          docker compose --env-file deploy/.env.production \
            -f compose.yaml -f compose.production.yaml build init
          docker compose --env-file deploy/.env.production \
            -f compose.yaml -f compose.production.yaml \
            up -d --no-build --pull never --wait
          REMOTE

      - name: Verify public application
        env:
          PROD_URL: ${{ vars.PROD_URL }}
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "$PROD_URL/health/ready"
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            --output /dev/null "$PROD_URL/app/"
